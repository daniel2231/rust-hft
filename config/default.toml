mode = "paper"
symbol = "BTCUSDT"
strategy = "momentum"   # "noop" | "pingpong" | "momentum"

[paper]
initial_capital_usdt = 730.0   # 가상 초기 자본 (USDT). 백만원 ≈ 730 USDT
fee_pct = 0.05                 # 체결당 수수료 % — momentum은 taker 체결이므로 0.05 (pingpong은 maker 0.02)

[risk]
max_order_qty = 0.01
min_free_balance_usdt = 100.0
price_band_pct = 1.0
max_orders_per_sec = 5

[orderbook]
depth_levels = 20

[exchange]
ws_url = "wss://fstream.binance.com/ws"
rest_url = "https://fapi.binance.com"

[watchdog]
timeout_secs = 30

[dashboard]
port = 3000
enabled = true
